# The pool behind the CE, in the same container (pool.conf). The packaged default names the
# schedd after the host, which the router cannot find (see SCHEDD_NAME in pool.conf).
JOB_ROUTER_SCHEDD2_NAME = pool@$(FULL_HOSTNAME)

# Route new jobs every few seconds instead of every ten, so a test job reaches the pool quickly.
JOB_ROUTER_POLLING_PERIOD = 2
