# The batch pool behind the CE: one machine that is central manager, submit and execute node.
use ROLE: CentralManager
use ROLE: Submit
use ROLE: Execute
CONDOR_HOST = $(FULL_HOSTNAME)

# The CE's job router finds this schedd by name (ce-router.conf). HTCondor resolves a plain
# name through DNS, and a container's reverse DNS gives another name than its hostname; a
# `name@host` name is taken as it is.
SCHEDD_NAME = pool@$(FULL_HOSTNAME)

# Match jobs every few seconds instead of every minute, so a test job starts straight away.
NEGOTIATOR_INTERVAL = 2
