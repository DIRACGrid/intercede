# Backend half of the `basic` configuration: mounted into the CE as
# /etc/condor-ce/config.d/99-basic.conf. Changes together with intercede-client.toml
# (integration-stacks.md, rule 7).

# Clients authenticate with an ID token (issue #23: the pure-IDTOKENS basic configuration). Out
# of the box the CE's collector accepts one, but its schedd takes only SCITOKENS and SSL from a
# client. FS stays for the CE's own daemons and tools inside the container.
SCHEDD.SEC_READ_AUTHENTICATION_METHODS = FS, TOKEN
SCHEDD.SEC_WRITE_AUTHENTICATION_METHODS = FS, TOKEN

# The host reaches the CE through the published port 127.0.0.1:9619 (integration-stacks.md,
# rule 9). The CE's daemons all share that port, so advertising it works both from the host and
# from inside the container, where 127.0.0.1:9619 is the CE itself.
TCP_FORWARDING_HOST = 127.0.0.1

# The CE's schedd name, as clients pass it with `-name`. HTCondor tools look a plain name up in
# DNS and reject it when the host cannot resolve it (a container hostname, or `localhost`); a
# name of the form `name@host` is taken as it is.
SCHEDD_NAME = htcondor-ce@backend
