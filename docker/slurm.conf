# =============================================================================
# slurm.conf - single-node SLURM cluster for CI/integration testing
#
# NOTE: TaskPlugin=task/none and ProctrackType=proctrack/linuxproc are used
# instead of the cgroup-based plugins because GitLab CI docker executors
# usually do NOT grant access to the host cgroup hierarchy needed by
# proctrack/cgroup or task/cgroup. If your runner is privileged and mounts
# /sys/fs/cgroup read-write, you can switch to the cgroup plugins for more
# realistic resource accounting.
# =============================================================================
ClusterName=citest
SlurmctldHost=localhost

SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

SchedulerType=sched/backfill
ReturnToService=2
MpiDefault=none

# --- Node & partition: one fake compute node backing the whole cluster ---
NodeName=arc-ce NodeAddr=localhost CPUs=2 RealMemory=2000 State=UNKNOWN
PartitionName=main Nodes=arc-ce Default=YES MaxTime=INFINITE State=UP
