version: "3.8"

services:
  arc-ce:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: arc-ce-slurm-test:local
    container_name: arc-ce-slurm-test
    hostname: arc-ce
    privileged: true   # needed for systemd-as-PID1 (see README)
    ports:
      - "8443:443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 30
