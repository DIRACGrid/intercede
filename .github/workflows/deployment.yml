name: Release

on:
  push:
    branches:
      - main
  # Rebuild and publish an existing release tag, for when a publish failed after
  # release-please had already created the release. Run it from main: the pypi
  # environment only accepts deployments from main.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.1.0)
        required: true

# One release run at a time, so two quick merges cannot both try to create the
# same release. Queued runs are not cancelled: one may be waiting on the pypi
# environment approval.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Opens/updates the release PR; once that PR is merged, creates the tag and the
  # GitHub release. It uses the action's default token (the job's GITHUB_TOKEN),
  # not a stored PAT. Nothing done with that token starts another workflow, so
  # publishing happens in this workflow, gated on release_created (same layout
  # as diracx-web).
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: simple

  build:
    name: Build distribution 📦
    needs: release-please
    runs-on: ubuntu-latest
    # !cancelled() lets this run when release-please was skipped (manual run).
    if: >-
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Build the release tag itself so hatch-vcs reads the release version.
        ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"
    - name: Installing dependencies
      run: |
          python -m pip install build "readme_renderer[md]"
    - name: Validate README for PyPI
      run: |
        python -m readme_renderer README.md -o /tmp/README.html
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  publish:
    name: Publish distribution 📦 to PyPI
    needs: build
    # Without this, a manual run skips publish too: the skipped release-please
    # job further up the chain would count against it.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/intercede
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download the distribution packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
