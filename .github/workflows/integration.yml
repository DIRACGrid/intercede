# Matrix comes from tests/integration/stacks.yml. Not a required check until #14.
name: Integration tests

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "tests/integration/**"
      - ".github/workflows/integration.yml"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "src/**"

permissions:
  contents: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate {stack x config x version} matrix from stacks.yml
        id: gen
        run: python3 tests/integration/generate_matrix.py --github-output

  integration:
    needs: matrix
    if: needs.matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    name: ${{ matrix.stack }} / ${{ matrix.config }} / ${{ matrix.version }}
    env:
      COMPOSE_FILE: tests/integration/stacks/${{ matrix.compose_env }}/compose.yml
      BACKEND_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the stack (waits for the healthchecks)
        run: docker compose -f "$COMPOSE_FILE" up --wait

      - name: Apply workarounds
        if: matrix.exec_in_container == false
        run: |
          # Workaround for https://github.com/prefix-dev/pixi/issues/3762
          sed -i.bak 's@editable = true@editable = false@g' pyproject.toml
          rm pyproject.toml.bak
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        if: matrix.exec_in_container == false
        with:
          pixi-version: v0.84.2
          cache: false
          environments: py313

      - name: Run the contract suite
        env:
          EXEC_IN_CONTAINER: ${{ matrix.exec_in_container }}
          MARKERS: ${{ matrix.markers }}
          STACK: ${{ matrix.stack }}
          CONFIG: ${{ matrix.config }}
        run: |
          if [ "$EXEC_IN_CONTAINER" = "true" ]; then
            # TODO(#13/#14): ship the suite in the image and exec as an unprivileged user.
            runner=(docker compose -f "$COMPOSE_FILE" exec -T backend pytest)
          else
            # Independent tests, run side by side (stacks.yml `workers`).
            runner=(pixi run -e py313 pytest -n "${{ matrix.workers }}")
          fi
          # -rs --no-fold-skipped: name every skipped test and why. Every stack
          # runs the shared suite, so a run that selects no test fails (exit 5).
          "${runner[@]}" tests/integration -m "$MARKERS" -rs --no-fold-skipped \
            --stack="$STACK" --config="$CONFIG"

      - name: Collect daemon logs
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --no-color > compose-logs.txt || true

      - name: Upload logs as artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.stack }}-${{ matrix.config }}-${{ matrix.version }}
          path: compose-logs.txt
