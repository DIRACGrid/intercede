name: Set up pixi
description: >
  Install pixi and the requested environment(s), with the prefix-dev/pixi#3762 workaround.

inputs:
  environments:
    description: Space-separated pixi environment name(s) to install (e.g. "py313").
    required: true

runs:
  using: composite
  steps:
    - uses: prefix-dev/setup-pixi@v0.9.3
      with:
        run-install: false
        post-cleanup: false
    - name: Workaround for prefix-dev/pixi#3762
      shell: bash
      run: |
        sed -i.bak 's@editable = true@editable = false@g' pyproject.toml
        rm pyproject.toml.bak
        git diff --stat
    - uses: prefix-dev/setup-pixi@v0.9.3
      with:
        cache: false
        environments: ${{ inputs.environments }}
